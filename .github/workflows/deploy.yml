name: 自动更新免费节点订阅与数据

# Free 计划资源预算:
# - 定时 schedule: 每 6 小时 1 次 (UTC) — 主触发源
# - push 触发: 仅当改动涉及源码 (scraper/test/config/workflows/package) 时运行;
#   纯订阅产物提交 (artifacts/subs/*, README.md, data/historical.json) 跳过,
#   避免 CI 自我触发循环消耗分钟 (GitHub 原生不识别 [skip ci])
# - 合并原 update-data.yml: 订阅产物/README/config/historical.json 同一 job 一次生成一次提交
#
# 月额度估算 (Free 公开仓库 2000 min): schedule 120 次 × ~5 min = 600 min (30%),
# push 条件化后额外消耗 ≈ 0 (源码改动频率低)
on:
  schedule:
    - cron: '0 */6 * * *'
      # 每 6 小时 1 次: UTC 00:00/06:00/12:00/18:00
      # 注意: GitHub Actions 对长时间无活动的仓库可能跳过 schedule 运行;
      # 仓库保持活跃 (定期 push 或手动触发) 可避免该限制。
  push:
    branches: [ main ]
    # 仅源码/配置类改动触发 push 事件; 产物类提交 (artifacts/subs/*, README,
    # data/historical.json) 不触发 → CI 自我推送不再消耗分钟。
    # 完整抓取仍由 6h 定时与 workflow_dispatch 驱动。
    paths:
      - 'scraper.js'
      - 'test.js'
      - 'test-regression.js'
      - 'update-readme-badges.js'
      - 'lib/**'
      - 'scripts/**'
      - 'test-probe.js'
      - 'test-score-labels.js'
      - 'config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

# 并发控制: 单一 workflow 组, 防止并行 push 竞态
concurrency:
  group: autosubscribe-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 唯一 job: schedule / 手动触发 / 源码类 push 都跑完整流程。
  # 产物类提交已被上方 push.paths 过滤, 无需再单独判断。
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      # 检出仓库代码 (Node 24 runtime)
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 设置Node.js环境 (Node 24 LTS)
      - name: 设置Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # 安装依赖 (lockfile 已提交, 使用 npm ci 保证可重复构建)
      - name: 安装依赖
        run: npm ci

      # 单元、回归与 Clash/Mihomo 订阅兼容性测试
      - name: 运行测试
        run: npm test

      # 执行节点抓取 (生成 5 个订阅文件 + README + config + 运行状态)
      - name: 运行爬虫
        run: node scraper.js

      # 发布前校验实际生成的订阅文件, 失败则阻止提交/推送
      - name: 校验订阅产物
        run: node validate-released.js

      # 使用官方 Mihomo 稳定版真实解析生成的订阅; 不依赖 YAML parser 代替内核校验
      - name: Mihomo 内核兼容性验证
        run: |
          MIHOMO_VERSION=v1.19.33
          curl -fsSL "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz" -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > /tmp/mihomo
          chmod +x /tmp/mihomo
          /tmp/mihomo -v
          /tmp/mihomo -t -f artifacts/subs/all.yaml
          # mihomo.yaml 的 GeoSite/GeoIP 规则会触发外部数据库下载; 这里保留代理、组和根配置结构,
          # 临时移除地理规则以确保 CI 验证聚焦于配置结构和节点协议字段。
          node - <<'NODE'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const config = yaml.load(fs.readFileSync('artifacts/subs/mihomo.yaml', 'utf8'));
          config.rules = ['MATCH,漏网之鱼'];
          delete config['geox-url'];
          fs.writeFileSync('/tmp/mihomo-validation.yaml', yaml.dump(config, { lineWidth: -1, noRefs: true }));
          NODE
          /tmp/mihomo -t -f /tmp/mihomo-validation.yaml

      # 云端真实出站探测: 先独立生成健康报告与分层文件，随后单独应用分数标记。
      - name: 云端 Mihomo 真实节点检测
        run: |
          node scripts/probe-nodes.js --mode cloud --input artifacts/subs/mihomo.yaml --output-dir artifacts/health/cloud --mihomo-bin /tmp/mihomo --timeout 5000 --rounds 4 --concurrency 40

      # 将真实探测分数写入节点名称；未达到最小样本量的节点标记 Q?，不伪造分数。
      # 同步更新 Mihomo proxy-groups 引用，并再次用真实内核校验重命名后的配置。
      - name: 标记节点实测质量分
        run: |
          node scripts/apply-health-scores.js --report artifacts/health/cloud/report.json
          node validate-released.js
          /tmp/mihomo -t -f artifacts/subs/all.yaml
          # 与前置验证一致：临时去除 GeoSite/GeoIP 规则，避免验证时下载外部数据库。
          node - <<'NODE'
          const fs = require('fs');
          const yaml = require('js-yaml');
          const config = yaml.load(fs.readFileSync('artifacts/subs/mihomo.yaml', 'utf8'));
          config.rules = ['MATCH,漏网之鱼'];
          delete config['geox-url'];
          fs.writeFileSync('/tmp/mihomo-validation-scored.yaml', yaml.dump(config, { lineWidth: -1, noRefs: true }));
          NODE
          /tmp/mihomo -t -f /tmp/mihomo-validation-scored.yaml

      # 保留最近 14 天逐次探测报告，供跨时间窗口校准质量评分；不把历史快照扩张进 Git 提交历史。
      - name: 归档质量评分校准快照
        uses: actions/upload-artifact@v7
        with:
          name: health-calibration-${{ github.run_id }}
          path: artifacts/health/cloud/report.json
          if-no-files-found: error
          retention-days: 14

      # 更新 README 顶部的 3 个订阅数量徽章；正文统计由 scraper.js 维护。
      - name: 更新 README 徽章
        run: node update-readme-badges.js

      # 更新历史数据 (lib/history.js: 将本次抓取结果写入 data/historical.json)
      - name: 更新历史数据
        run: |
          node -e "
            const { saveHistoricalProxies } = require('./lib/history');
            const fs = require('fs');
            const yaml = require('js-yaml');
            const cfg = yaml.load(fs.readFileSync('artifacts/subs/all.yaml', 'utf8'));
            const proxies = (cfg && cfg.proxies) || [];
            if (proxies.length === 0) {
              console.log('[History] Zero proxies, skipping historical update');
              process.exit(0);
            }
            saveHistoricalProxies(proxies);
          "

      # 提交更新的文件到主分支
      - name: 提交更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 订阅产物位于 artifacts/subs/ 且被 .gitignore, 需 -f 强制暂存
          git add -f artifacts/subs/mihomo.yaml artifacts/subs/all.yaml artifacts/subs/base64.txt artifacts/subs/byxiaoxi.txt artifacts/subs/kooker.jp.txt
          git add -f artifacts/health/cloud/report.json artifacts/health/cloud/working.yaml artifacts/health/cloud/stable.yaml artifacts/health/cloud/quality.yaml
          git add README.md config.json data/historical.json
          # 仅在暂存区有变更时提交并发布。
          # workflow_dispatch 若从非 main 分支启动，不允许把该分支产物写回 main。
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::warning::当前运行 ref=$GITHUB_REF，不是 refs/heads/main；跳过向 main 发布。"
            exit 0
          fi
          # 排队中的 schedule/push 运行可能仍基于旧 GITHUB_SHA 检出代码；
          # 若 main 已被先完成的运行更新，直接跳过过期产物，避免 rebase 订阅/报告时发生冲突。
          if ! git diff --cached --quiet; then
            git commit -m "自动更新: 更新节点数据与订阅 [skip ci]"
            git fetch origin main
            RUN_BASE="$GITHUB_SHA"
            REMOTE_MAIN="$(git rev-parse origin/main)"
            if [ "$REMOTE_MAIN" != "$RUN_BASE" ]; then
              echo "::warning::main 已从本次运行基线 $RUN_BASE 前进到 $REMOTE_MAIN；跳过过期产物发布，等待下一轮基于最新 main 重新生成。"
              exit 0
            fi

            # 不 rebase 生成物提交。若 fetch 后又有外部提交抢先更新 main，
            # 只在确认远端已前进时安全跳过；认证/权限等其他 push 错误仍应使 job 失败。
            if ! git push origin HEAD:main; then
              git fetch origin main
              REMOTE_MAIN="$(git rev-parse origin/main)"
              if [ "$REMOTE_MAIN" != "$RUN_BASE" ]; then
                echo "::warning::发布期间 main 已前进到 $REMOTE_MAIN；本轮产物未发布，等待下一轮重新生成。"
                exit 0
              fi
              echo "::error::推送失败，但 main 未发生前进；请检查 GitHub 写入权限或远端错误。"
              exit 1
            fi
          else
            echo "No changes to commit"
          fi
